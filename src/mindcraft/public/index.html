<!DOCTYPE html>
<html>
<head>
    <title>Mindcraft 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-0: #171225;
            --bg-1: #1c1530;
            --bg-2: #221a38;
            --bg-3: #281f42;
            --border: rgba(216, 160, 220, 0.28);
            --text-1: #e9d7ee;
            --text-2: #b395c2;
            --accent: #ff8fb8;
            --accent-strong: #f76fa4;
            --success: #5fdca0;
            --danger: #ff7d92;
            --warning: #ffb45e;
            --panel: rgba(38, 28, 58, 0.85);
            --input-bg: #2a2144;
            --btn-text: #ffe6f2;
            --radius-lg: 22px;
            --radius-md: 14px;
            --shadow-soft: 0 14px 30px rgba(0, 0, 0, 0.35);
            --glow-pink: rgba(255, 143, 184, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 24px;
            min-height: 100vh;
            color: var(--text-1);
            background:
                radial-gradient(circle at top left, rgba(255, 143, 184, 0.16), transparent 32%),
                radial-gradient(circle at bottom right, rgba(95, 220, 160, 0.10), transparent 36%),
                linear-gradient(180deg, var(--bg-0) 0%, #141021 100%);
        }

        h1 {
            color: var(--accent-strong);
            font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
            font-size: 2rem;
            letter-spacing: -0.03em;
            margin: 0;
        }

        button, input, select {
            font-family: inherit;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 143, 184, 0.4); border-radius: 999px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .title-row {
            margin-bottom: 18px;
        }

        #agents {
            display: grid;
            gap: 16px;
            padding: 0;
            background: transparent;
            border-radius: var(--radius-lg);
            box-shadow: none;
        }

        .agent {
            margin: 0;
            padding: 18px;
            background: linear-gradient(180deg, rgba(44, 33, 70, 0.96), rgba(35, 26, 56, 0.96));
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft), 0 0 24px rgba(255, 143, 184, 0.06);
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .restart-btn, .start-btn, .stop-btn {
            color: var(--btn-text);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px 13px;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-left: 6px;
            font-weight: 600;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

        .restart-btn {
            background: linear-gradient(180deg, rgba(95, 220, 160, 0.3), rgba(74, 180, 130, 0.3));
        }
        .start-btn {
            background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        }
        .stop-btn {
            background: linear-gradient(180deg, rgba(255, 167, 147, 0.3), rgba(255, 140, 120, 0.3));
        }

        .restart-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(95, 220, 160, 0.28); background: linear-gradient(180deg, rgba(95, 220, 160, 0.4), rgba(74, 180, 130, 0.4)); }
        .start-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(247, 111, 164, 0.35); background: linear-gradient(180deg, #ffa3c6, #f983b2); }
        .stop-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255, 140, 120, 0.3); background: linear-gradient(180deg, rgba(255, 167, 147, 0.4), rgba(255, 140, 120, 0.4)); }
        .gear-btn {
            background: rgba(255, 143, 184, 0.15);
            color: var(--text-1);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 10px;
            cursor: pointer;
            margin-left: 6px;
            font-size: 0.85em;
            transition: background 0.12s ease, transform 0.12s ease;
        }
        .gear-btn:hover { background: rgba(255, 143, 184, 0.3); transform: translateY(-1px); }
        .status-icon {
            font-size: 12px;
            margin-right: 8px;
        }
        .status-icon.online {
            color: var(--success);
            text-shadow: 0 0 12px rgba(47, 212, 124, 0.55);
        }
        .status-icon.offline {
            color: var(--danger);
        }
        #settingsForm {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        .setting-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 9px 11px;
            border-radius: var(--radius-md);
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
        }
        .setting-wrapper label {
            flex: 0 0 50%;
            font-size: 0.9em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .setting-wrapper input[type="text"],
        .setting-wrapper input[type="number"],
        .setting-wrapper select {
            flex: 1 1 0;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-1);
            border-radius: 8px;
            padding: 6px 9px;
            max-width: 100%;
            min-width: 0;
        }

        .setting-wrapper input:focus,
        .setting-wrapper select:focus,
        .msg-input:focus {
            outline: none;
            border-color: rgba(247, 111, 164, 0.65);
            box-shadow: 0 0 0 3px rgba(255, 143, 184, 0.22);
        }
        .setting-wrapper input[type="checkbox"] {
            transform: scale(1.2);
        }
        .agent-view-container {
            width: 100%;
            height: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
        }
        .agent-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .last-message {
            font-style: italic;
            color: var(--text-2);
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .start-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .agent-view-container {
            margin-top: 6px;
            display: flex;
            justify-content: flex-start;
        }
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 8px;
            width: 100%;
            align-items: start;
        }
        .agent-grid .cell {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: var(--radius-md);
        }
        .agent-grid .cell.title {
            background: transparent;
            padding: 0;
        }
        .agent-inventory {
            margin-top: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
        }
        .agent-inventory h3 { margin: 0 0 8px 0; font-size: 1em; letter-spacing: -0.01em; }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 6px;
        }
        /* Inventory item visuals */
        .inventory-grid.empty {
            display: grid;
            grid-template-columns: 1fr;
            color: var(--text-2);
        }
        .inv-item {
            position: relative;
            display: grid;
            grid-template-rows: auto auto;
            justify-items: center;
            align-items: center;
            gap: 4px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 9px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .inv-img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .inv-count {
            position: absolute;
            right: 6px;
            bottom: 6px;
            background: var(--accent-strong);
            color: #fff;
            font-size: 0.8em;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .inv-name {
            font-size: 0.85em;
            color: var(--text-2);
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* Armor icons */
        .armor-grid {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .armor-slot {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            background: var(--panel);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .armor-slot.empty { opacity: 0.4; }
        .armor-placeholder { color: var(--text-2); font-size: 0.9em; }
        .agent-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 6px;
            width: 100%;
        }
        .controls-row {
            margin-top: 8px;
            display: grid;
            grid-template-columns: auto minmax(100px, 1fr) repeat(5, auto);
            gap: 8px;
            align-items: center;
        }
        .msg-input {
            width: calc(100% - 8px);
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-1);
            border-radius: var(--radius-md);
            padding: 7px 9px;
        }

        .neutral-btn {
            color: var(--btn-text);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-left: 5px;
            background: rgba(255, 143, 184, 0.12);
            font-weight: 600;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        .neutral-btn:hover { background: rgba(255, 143, 184, 0.22); transform: translateY(-1px); }
        .neutral-btn:disabled {
            background: rgba(216, 160, 220, 0.08);
            color: #7d6a90;
            cursor: not-allowed;
            border-color: transparent;
        }

        .msg-input:disabled {
            background: rgba(38, 28, 58, 0.7);
            color: #7d6a90;
            cursor: not-allowed;
        }
        .page-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(23, 18, 37, 0.92);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            box-shadow: 0 -18px 35px rgba(247, 111, 164, 0.18);
        }
        body {
            padding-bottom: 80px;  /* Make room for footer */
        }
        .agent-stats-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 6px 0;
            font-size: 0.9em;
            color: var(--text-2);
            width: 100%;
            box-sizing: border-box;
        }
        .agent-stats-row .stat {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: var(--radius-md);
        }

        .status-badge {
            font-size: 0.78em;
            margin-left: 10px;
            padding: 4px 9px;
            border-radius: 999px;
            background: rgba(255, 93, 108, 0.12);
            color: var(--danger);
            text-transform: lowercase;
            border: 1px solid rgba(255, 93, 108, 0.24);
        }

        .status-badge.online {
            color: var(--success);
            background: rgba(47, 212, 124, 0.12);
            border-color: rgba(47, 212, 124, 0.26);
        }

        .status-badge.offline { color: var(--danger); }
        .title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title-spacer { flex: 1; }
        /* Modal styles */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: linear-gradient(180deg, #2a2144, #221a38);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: min(92vw, 1100px);
            height: min(84vh, 760px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(247, 111, 164, 0.3);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-close-btn {
            background: linear-gradient(180deg, rgba(255, 167, 147, 0.3), rgba(255, 140, 120, 0.3));
            color: var(--btn-text);
            border: none;
            border-radius: var(--radius-md);
            padding: 7px 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .modal-body {
            flex: 1 1 auto;
            overflow: auto;
            padding: 12px 16px;
        }
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        .footer-left { color: var(--text-2); font-style: italic; }
    </style>
</head>
<body>
    <div class="title-row">
        <div class="title-left">
            <h1 style="margin: 0;">🌸 Mindcraft</h1>
            <span id="msStatus" class="status-badge offline">mindserver offline</span>
        </div>
        <div class="title-spacer"></div>
    </div>
    <div id="agents"></div>

    <div class="page-footer">
        <div>
            <button id="openCreateAgentBtn" class="start-btn">New Agent</button>
        </div>
        <div style="display:flex; gap:12px;">
            <button class="stop-btn" onclick="disconnectAllAgents()">Disconnect All Agents</button>
            <button class="stop-btn" onclick="confirmShutdown()">Full Shutdown</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="createAgentModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 style="margin:0;">Create Agent</h2>
                <button id="closeCreateAgentBtn" class="modal-close-btn">Close</button>
            </div>
            <div class="modal-body">
                <div id="createAgentSection">
                    <div id="profileStatus" style="margin:6px 0;">Profile: Not uploaded</div>
                    <div id="settingsForm"></div>
                    <div id="createError" style="color:var(--danger);margin-top:12px;font-weight:600;"></div>
                    <input type="file" id="profileFileInput" accept=".json,application/json" style="display:none">
                </div>
            </div>
            <div class="modal-footer">
                <div class="footer-left" id="footerStatus">Configure settings, then upload a profile and create the agent.</div>
                <div class="footer-actions">
                    <button id="uploadProfileBtn" class="start-btn">Upload Profile</button>
                    <button id="submitCreateAgentBtn" class="start-btn" disabled>Create Agent</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Agent Settings Modal -->
    <div id="agentSettingsModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 id="agentSettingsTitle" style="margin:0;">Agent Settings</h2>
                <button id="closeAgentSettingsBtn" class="modal-close-btn">Close</button>
            </div>
            <div class="modal-body">
                <div id="agentSettingsSection">
                    <div id="agentSettingsForm"></div>
                    <div id="agentSettingsError" style="color:var(--danger);margin-top:12px;font-weight:600;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="footer-left" id="agentSettingsFooter">Modify settings then apply to restart the agent.</div>
                <div class="footer-actions">
                    <button id="discardAgentSettingsBtn" class="neutral-btn">Discard Changes</button>
                    <button id="applyAgentSettingsBtn" class="start-btn" disabled>Apply & Restart</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ path: window.location.pathname + 'socket.io' })
        const agentsDiv = document.getElementById('agents');
        let settingsSpec = {};
        let profileData = null;
        const agentSettings = {};
        const agentLastMessage = {};
        const inventoryOpen = {};
        let currentAgents = [];

        // Item texture helpers (use PrismarineJS minecraft-assets CDN with graceful fallbacks)
        const BASE_ICON_VERSION_CANDIDATES = ['1.21.8'];
        const PATH_CANDIDATES = ['items', 'blocks'];
        function buildVersionCandidatesForAgent(agentName) {
            const preferred = (agentSettings[agentName] && agentSettings[agentName].minecraft_version && agentSettings[agentName].minecraft_version !== 'auto')
                ? [String(agentSettings[agentName].minecraft_version)]
                : [];
            const merged = [...preferred, ...BASE_ICON_VERSION_CANDIDATES];
            // de-duplicate while preserving order
            const seen = new Set();
            const uniq = [];
            for (const v of merged) { if (!seen.has(v)) { seen.add(v); uniq.push(v); } }
            return uniq;
        }
        function getItemIconUrl(itemName, vers, pathType) {
            return `https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/${vers}/${pathType}/${itemName}.png`;
        }
        function buildIconUrlCandidates(itemName, agentName) {
            // Prefer local proxy that resolves items vs blocks using minecraft-assets
            const proxiedFirst = [`/assets/item/${agentName}/${itemName}.png`];
            const versList = buildVersionCandidatesForAgent(agentName);
            const urls = [...proxiedFirst];
            for (const vers of versList) {
                for (const p of PATH_CANDIDATES) {
                    urls.push(getItemIconUrl(itemName, vers, p));
                }
            }
            return urls;
        }
        function fallbackItemIcon(imgEl) {
            const list = (imgEl.dataset.urlList ? imgEl.dataset.urlList.split('||') : []);
            let i = Number(imgEl.dataset.urlIndex || '0');
            if (i < list.length - 1) {
                i++;
                imgEl.dataset.urlIndex = String(i);
                imgEl.src = list[i];
            } else {
                imgEl.onerror = null;
                imgEl.src = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="100%" height="100%" fill="#444"/><text x="50%" y="55%" font-size="12" fill="#bbb" text-anchor="middle">?</text></svg>');
            }
        }
        function prettyItemName(name) {
            return String(name || '').replace(/_/g, ' ');
        }

        function iconHTMLForItem(itemName, title, agentName) {
            const cands = buildIconUrlCandidates(itemName, agentName);
            const icon = cands[0];
            return `
                <div class="armor-slot" title="${title}">
                    <img class="inv-img" src="${icon}" data-url-index="0" data-url-list="${cands.join('||')}" onerror="fallbackItemIcon(this)" alt="${title}">
                </div>
            `;
        }
        function emptySlotHTML(label) {
            return `<div class="armor-slot empty" title="${label}: none"><span class="armor-placeholder">-</span></div>`;
        }

        const statusEl = document.getElementById('msStatus');
        function updateStatus(connected) {
            if (!statusEl) return;
            if (connected) {
                statusEl.textContent = 'MindServer online';
                statusEl.classList.remove('offline');
                statusEl.classList.add('online');
            } else {
                statusEl.textContent = 'MindServer offline';
                statusEl.classList.remove('online');
                statusEl.classList.add('offline');
            }
        }
        function subscribeToState() {
            socket.emit('listen-to-agents');
        }
        // Initial status
        updateStatus(false);
        socket.on('connect', () => {
            updateStatus(true);
            subscribeToState();
            // Clear all cached settings on reconnect
            Object.keys(agentSettings).forEach(name => delete agentSettings[name]);
        });
        socket.on('disconnect', () => {
            updateStatus(false);
        });
        socket.on('connect_error', () => {
            updateStatus(false);
        });

        fetch('/settings_spec.json')
            .then(r => r.json())
            .then(spec => {
                settingsSpec = spec;
                buildSettingsForm();
            });

        function buildSettingsForm() {
            const form = document.getElementById('settingsForm');
            form.innerHTML = '';
            // ensure grid for multi-column layout
            form.style.display = 'grid';
            form.style.gridTemplateColumns = 'repeat(auto-fit, minmax(320px, 1fr))';
            form.style.gap = '8px';
            Object.keys(settingsSpec).forEach(key => {
                if (key === 'profile') return; // profile handled via upload
                const cfg = settingsSpec[key];
                const wrapper = document.createElement('div');
                wrapper.className = 'setting-wrapper';
                const label = document.createElement('label');
                label.textContent = key === 'speak' ? '음성' : key;
                label.title = key === 'speak' ? '이 봇의 대사를 PC 스피커로 읽습니다.' : (cfg.description || '');
                let input;
                switch (cfg.type) {
                    case 'boolean':
                        input = document.createElement('input');
                        input.type = 'checkbox';
                        input.checked = cfg.default === true;
                        break;
                    case 'number':
                        input = document.createElement('input');
                        input.type = 'number';
                        input.value = cfg.default;
                        break;
                    default:
                        input = document.createElement('input');
                        input.type = 'text';
                        input.value = typeof cfg.default === 'object' ? JSON.stringify(cfg.default) : cfg.default;
                }
                input.title = cfg.description || '';
                input.id = `setting-${key}`;
                wrapper.appendChild(label);
                wrapper.appendChild(input);
                form.appendChild(wrapper);
            });
        }

        document.getElementById('uploadProfileBtn').addEventListener('click', () => {
            document.getElementById('profileFileInput').click();
        });

        document.getElementById('profileFileInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    profileData = JSON.parse(ev.target.result);
                    document.getElementById('submitCreateAgentBtn').disabled = false;
                    document.getElementById('profileStatus').textContent = `Profile: ${profileData.name || 'Uploaded'}`;
                    document.getElementById('createError').textContent = '';
                } catch (err) {
                    document.getElementById('createError').textContent = 'Invalid profile JSON: ' + err.message;
                    profileData = null;
                    document.getElementById('submitCreateAgentBtn').disabled = true;
                    document.getElementById('profileStatus').textContent = 'Profile: Not uploaded';
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.getElementById('submitCreateAgentBtn').addEventListener('click', () => {
            if (!profileData) return;
            const settings = { profile: profileData };
            Object.keys(settingsSpec).forEach(key => {
                if (key === 'profile') return;
                const input = document.getElementById(`setting-${key}`);
                if (!input) return;
                const type = settingsSpec[key].type;
                let val;
                if (type === 'boolean') val = input.checked;
                else if (type === 'number') val = Number(input.value);
                else if (type === 'array' || type === 'object') {

        function fetchAgentSettings(name) {
            return new Promise((resolve) => {
                if (agentSettings[name]) { resolve(agentSettings[name]); return; }
                socket.emit('get-settings', name, res => {
                    if (res.settings) {
                        agentSettings[name] = res.settings;

                    } else resolve(null);

        }

        // Agent settings modal logic
        const agentSettingsModal = document.getElementById('agentSettingsModal');
        const agentSettingsForm = document.getElementById('agentSettingsForm');
        const applyBtn = document.getElementById('applyAgentSettingsBtn');
        const discardBtn = document.getElementById('discardAgentSettingsBtn');
        const closeAgentSettingsBtn = document.getElementById('closeAgentSettingsBtn');
        const agentSettingsTitle = document.getElementById('agentSettingsTitle');
        let currentAgentName = null;
        let originalAgentSettings = null;
        let modelChoices = null;

        const MODEL_PROVIDERS = [
            { id: 'cli/cursor', label: 'Cursor CLI' },
            { id: 'cli/chatgpt', label: 'ChatGPT CLI' },
            { id: 'cli/claude', label: 'Claude CLI' },
            { id: 'openai', label: 'OpenAI' },
            { id: 'anthropic', label: 'Anthropic' },
            { id: 'google', label: 'Google' },

        function guessProvider(model) {
            const text = String(model || '').toLowerCase();
            if (!text) return '';
            if (text.includes('gpt') || text.includes('o1') || text.includes('o3')) return 'openai';
            if (text.includes('claude')) return 'anthropic';
            if (text.includes('gemini')) return 'google';
            if (text.includes('grok')) return 'xai';
            if (text.includes('mistral')) return 'mistral';
            if (text.includes('deepseek')) return 'deepseek';
            if (text.includes('qwen')) return 'qwen';
            return '';
        }

        function splitModel(model) {
            const text = String(model || '').trim();
            const parts = text.split('/').filter(Boolean);
            if (parts[0] === 'cli' && parts[1]) {
                return { provider: `cli/${parts[1]}`, modelId: parts.slice(2).join('/') };
            }
            if (parts.length > 1 && MODEL_PROVIDERS.some(item => item.id === parts[0])) {
                return { provider: parts[0], modelId: parts.slice(1).join('/') };
            }
            const guessed = guessProvider(text);
            if (guessed) return { provider: guessed, modelId: text };
            return { provider: '', modelId: text };
        }

        function joinModel(provider, modelId) {
            if (!provider) return modelId;
            return modelId ? `${provider}/${modelId}` : provider;
        }

        function providerLabel(provider) {
            return MODEL_PROVIDERS.find(item => item.id === provider)?.label || provider;
        }

        function cliName(provider) {
            return String(provider || '').startsWith('cli/') ? provider.slice(4) : '';
        }

        function modelLabel(model) {
            const { provider, modelId } = splitModel(model);
            const name = providerLabel(provider);
            if (!modelId) return name ? `${name} 기본 모델` : (model || '기본 모델');
            const cli = cliName(provider);
            if (cli) {
                const match = (modelChoices?.[cli] || []).find(choice => choice.id === modelId);
                return `${name} / ${match?.label || modelId}`;
            }
            return name ? `${name} / ${modelId}` : modelId;
        }

        async function ensureModelChoices(provider) {
            if (!provider) return [];
            if (!modelChoices) modelChoices = {};
            const res = await fetch('/cli-models?provider=' + encodeURIComponent(provider) + '&t=' + Date.now());
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'model list failed');
            modelChoices[provider] = Array.isArray(data.models) ? data.models : [];
            return modelChoices[provider];
        }

        function buildAgentSettingsForm(settings) {
            agentSettingsForm.innerHTML = '';
            agentSettingsForm.style.display = 'grid';
            agentSettingsForm.style.gridTemplateColumns = 'repeat(auto-fit, minmax(320px, 1fr))';
            agentSettingsForm.style.gap = '8px';
            appendModelSetting(settings.profile?.model || '');
            Object.keys(settingsSpec).forEach(key => {
                if (key === 'profile') return; // profile not edited here
                const cfg = settingsSpec[key];
                const wrapper = document.createElement('div');
                wrapper.className = 'setting-wrapper';
                const label = document.createElement('label');
                label.textContent = key === 'speak' ? '음성' : key;
                label.title = key === 'speak' ? '이 봇의 대사를 PC 스피커로 읽습니다.' : (cfg.description || '');
                let input;
                switch (cfg.type) {
                    case 'boolean':
                        input = document.createElement('input');
                        input.type = 'checkbox';
                        input.checked = Boolean(settings[key]);
                        break;
                    case 'number':
                        input = document.createElement('input');
                        input.type = 'number';
                        input.value = settings[key] ?? cfg.default ?? 0;
                        break;
                    default:
                        input = document.createElement('input');
                        input.type = 'text';
                        const defVal = settings[key] ?? cfg.default ?? '';
                        input.value = typeof defVal === 'object' ? JSON.stringify(defVal) : defVal;
                }
                input.id = `agent-setting-${key}`;
                input.addEventListener('input', onAgentSettingsChanged);
                if (input.type === 'checkbox') input.addEventListener('change', onAgentSettingsChanged);
                wrapper.appendChild(label);
                wrapper.appendChild(input);
                agentSettingsForm.appendChild(wrapper);
            });
            onAgentSettingsChanged();
        }

        function fillModelOptions(provider, modelId) {
            const select = document.getElementById('agent-model-id');
            if (!select) return;
            const cli = cliName(provider);
            const fetched = cli ? ((modelChoices && modelChoices[cli]) || []).filter(choice => choice.id) : [];
            const choices = [{ id: '', label: cli ? '계정 기본값' : '기본 모델' }, ...fetched];
            const options = choices.slice();
            if (modelId && !options.some(choice => choice.id === modelId)) {
                options.push({ id: modelId, label: modelId });
            }
            select.innerHTML = '';
            options.forEach(choice => {
                const option = document.createElement('option');
                option.value = choice.id;
                option.textContent = choice.label;
                select.appendChild(option);
            });
            select.value = options.some(choice => choice.id === modelId) ? modelId : '';
        }

        function appendModelSetting(model) {
            const parsed = splitModel(model);
            const wrapper = document.createElement('div');
            wrapper.className = 'setting-wrapper';
            wrapper.style.gridColumn = '1 / -1';
            wrapper.style.flexDirection = 'column';
            wrapper.style.alignItems = 'stretch';
            const label = document.createElement('label');
            label.textContent = 'model';
            label.title = '제공자와 모델. CLI와 API를 고를 수 있다. 적용하면 이 플레이어만 다시 접속한다.';
            label.style.flex = '0 0 auto';

            const provider = document.createElement('select');
            provider.id = 'agent-model-provider';
            if (!parsed.provider) {
                const blank = document.createElement('option');
                blank.value = '';
                blank.textContent = '제공자 선택';
                provider.appendChild(blank);
            }
            const providers = MODEL_PROVIDERS.slice();
            if (parsed.provider && !providers.some(item => item.id === parsed.provider)) {
                providers.unshift({ id: parsed.provider, label: parsed.provider });
            }
            providers.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.label;
                provider.appendChild(option);
            });
            provider.value = parsed.provider;

            const select = document.createElement('select');
            select.id = 'agent-model-id';
            const custom = document.createElement('input');
            custom.type = 'text';
            custom.id = 'agent-model-custom';
            custom.placeholder = '모델 id 직접 입력';
            custom.title = '목록에 없는 모델 id. 비우면 가운데 선택을 사용한다.';

            provider.addEventListener('change', async () => {
                const next = provider.value;
                custom.value = '';
                const cli = cliName(next);
                if (cli) {
                    select.innerHTML = '';
                    const loading = document.createElement('option');
                    loading.value = '';
                    loading.textContent = '목록 불러오는 중...';
                    select.appendChild(loading);
                    try {
                        await ensureModelChoices(cli);
                    } catch {
                        if (!modelChoices) modelChoices = {};
                        modelChoices[cli] = modelChoices[cli] || [];
                    }
                }
                fillModelOptions(next, '');
                onAgentSettingsChanged();
            });
            select.addEventListener('change', onAgentSettingsChanged);
            custom.addEventListener('input', onAgentSettingsChanged);

            wrapper.appendChild(label);
            wrapper.appendChild(provider);
            wrapper.appendChild(select);
            wrapper.appendChild(custom);
            agentSettingsForm.appendChild(wrapper);
            fillModelOptions(provider.value, parsed.modelId);
        }

        function openAgentSettings(name) {
            currentAgentName = name;
            agentSettingsTitle.textContent = `${name} Settings`;

            agentSettingsModal.style.display = 'flex';
            applyBtn.disabled = true;
            fetchAgentSettings(name).then(async settings => {
                if (currentAgentName !== name) return;
                const { provider } = splitModel(settings?.profile?.model || '');
                const cli = cliName(provider);
                if (cli) {
                    try {
                        await ensureModelChoices(cli);
                    } catch {
                        // The form still opens with the default and the custom id field.
                    }
                }
                if (currentAgentName !== name) return;
                originalAgentSettings = JSON.parse(JSON.stringify(settings || {}));
                buildAgentSettingsForm(settings || {});
            });
        }
        window.openAgentSettings = openAgentSettings;

        function getEditedAgentSettings() {
            const profile = JSON.parse(JSON.stringify((originalAgentSettings && originalAgentSettings.profile) || {}));
            const provider = document.getElementById('agent-model-provider')?.value || '';
            const custom = document.getElementById('agent-model-custom');
            const selected = document.getElementById('agent-model-id');
            const modelId = (custom?.value || '').trim() || (selected?.value || '').trim();
            profile.model = joinModel(provider, modelId);
            const newSettings = { profile };
            Object.keys(settingsSpec).forEach(key => {
                if (key === 'profile') return;
                const cfg = settingsSpec[key];
                const input = document.getElementById(`agent-setting-${key}`);
                if (!input) return;
                let val;
                if (cfg.type === 'boolean') val = input.checked;
                else if (cfg.type === 'number') val = Number(input.value);
                else if (cfg.type === 'array' || cfg.type === 'object') {
                    try { val = JSON.parse(input.value); }
                    catch { val = input.value; }
                } else val = input.value;
                newSettings[key] = val;
            });
            return newSettings;
        }

        function shallowEqual(a, b) {
            if (!a || !b) return false;
            const keys = Object.keys(settingsSpec).filter(k => k !== 'profile');
            for (const k of keys) {
                const va = a[k];
                const vb = b[k];
                if (typeof va === 'object' || typeof vb === 'object') {
                    if (JSON.stringify(va) !== JSON.stringify(vb)) return false;
                } else if (va !== vb) return false;
            }
            return true;
        }

        function onAgentSettingsChanged() {
            if (!originalAgentSettings) { applyBtn.disabled = true; return; }
            const edited = getEditedAgentSettings();
            const sameModel = (edited.profile?.model || '') === (originalAgentSettings.profile?.model || '');
            applyBtn.disabled = shallowEqual(edited, originalAgentSettings) && sameModel;
        }

        function closeAgentSettings() {
            agentSettingsModal.style.display = 'none';
            currentAgentName = null;
            originalAgentSettings = null;
        }

                                    <button class="gear-btn" id="speakBtn-${agent.name}" title="이 봇의 대사를 PC 스피커로 읽습니다" onclick="toggleSpeak('${agent.name}')">${cfg.speak === false ? '음성 켜기' : '음성 끄기'}</button>

        async function renderAgents(agents) {
            if (!agents.length) {
                agentsDiv.innerHTML = '<div class="agent" style="text-align:center;color:var(--text-2);font-weight:600;">No agents connected yet</div>';
                return;
            }

            // If agentsDiv is empty, do a full render
            if (!agentsDiv.children.length) {
                agentsDiv.innerHTML = agents.map(agent => renderAgentCard(agent)).join('');
                // Update all viewers after initial render
                setTimeout(() => {
                    agents.forEach(a => {
                        if (a.in_game) updateAgentViewer(a.name);
                    });
                }, 0);
                return;
            }

            // Compare with current agents to find changes
            const prevAgents = currentAgents.reduce((acc, a) => ({ ...acc, [a.name]: a }), {});
            const changedAgents = agents.filter(a => {
                const prev = prevAgents[a.name];
                return !prev || prev.in_game !== a.in_game || prev.viewerPort !== a.viewerPort || prev.socket_connected !== a.socket_connected;
            });

            // Update only changed agents
            changedAgents.forEach(agent => {
                const el = document.getElementById(`agent-${agent.name}`);
                if (el) {
                    // Update existing card
                    el.outerHTML = renderAgentCard(agent);
                    if (agent.in_game) updateAgentViewer(agent.name);
                } else {
                    // Add new card
                    agentsDiv.insertAdjacentHTML('beforeend', renderAgentCard(agent));
                    if (agent.in_game) updateAgentViewer(agent.name);
                }
            });

            // Remove cards for agents that no longer exist
            Array.from(agentsDiv.children).forEach(el => {
                const name = el.id.replace('agent-', '');
                if (!agents.find(a => a.name === name)) {
                    el.remove();
                    delete inventoryOpen[name];
                }
            });
        }

        socket.on('agents-status', async (agents) => {
            // Fetch settings for all agents that don't have current settings
            const needSettings = agents.filter(a => !agentSettings[a.name]);
            if (needSettings.length > 0) {
                await Promise.all(needSettings.map(async (a) => {
                    const settings = await fetchAgentSettings(a.name);
                    if (settings) {
                        agentSettings[a.name] = settings;
                    }
                }));
            }

            // Compare with current agents to find changes
            const prevAgents = currentAgents.reduce((acc, a) => ({ ...acc, [a.name]: a }), {});
            const changedAgents = agents.filter(a => {
                const prev = prevAgents[a.name];
                return !prev || prev.in_game !== a.in_game || prev.viewerPort !== a.viewerPort || prev.socket_connected !== a.socket_connected;
            });

            // Update current agents list
            currentAgents = agents;

            // If agentsDiv is empty, do a full render
            if (!agentsDiv.children.length) {
                agentsDiv.innerHTML = agents.map(agent => renderAgentCard(agent)).join('');
                // Update all viewers after initial render
                setTimeout(() => {
                    agents.forEach(a => {
                        if (a.in_game) updateAgentViewer(a.name);
                    });
                }, 0);
                return;
            }

            // Update only changed agents
            changedAgents.forEach(agent => {
                const el = document.getElementById(`agent-${agent.name}`);
                if (el) {
                    // Update existing card
                    el.outerHTML = renderAgentCard(agent);
                    if (agent.in_game) updateAgentViewer(agent.name);
                } else {
                    // Add new card
                    agentsDiv.insertAdjacentHTML('beforeend', renderAgentCard(agent));
                    if (agent.in_game) updateAgentViewer(agent.name);
                }
            });

            // Remove cards for agents that no longer exist
            Array.from(agentsDiv.children).forEach(el => {
                const name = el.id.replace('agent-', '');
                if (!agents.find(a => a.name === name)) {
                    el.remove();
                    delete inventoryOpen[name];
                }
            });
        });

        function toggleSpeak(name) {
            const next = agentSettings[name]?.speak === false;
            if (!agentSettings[name]) agentSettings[name] = {};
            agentSettings[name].speak = next;
            const btn = document.getElementById(`speakBtn-${name}`);
            if (btn) btn.textContent = next ? '음성 끄기' : '음성 켜기';
            socket.emit('set-speak', name, next);
        }
        window.toggleSpeak = toggleSpeak;

        function restartAgent(n) { socket.emit('restart-agent', n); }
        function disconnectAgent(n) { socket.emit('stop-agent', n); }
        function startAgent(n) { 
            const btn = document.querySelector(`button[onclick="startAgent('${n}')"]`);
            if (btn) {
                btn.textContent = 'Connecting...';
                btn.disabled = true;
                // Re-enable after 10s if still disabled (agent failed to connect)
                setTimeout(() => {
                    const retryBtn = document.querySelector(`button[onclick=\\"startAgent('${n}')\\"]`);
                    const agentState = (window.currentAgents || []).find(a => a.name === n);
                    const stillWaiting = agentState ? (!agentState.in_game && !agentState.socket_connected) : true;
                    if (retryBtn && stillWaiting) {
                        retryBtn.disabled = false;
                        retryBtn.textContent = 'Connect';
                    }
                }, 10000);
            }
            socket.emit('start-agent', n);
        }
        function stopAgent(n) { socket.emit('stop-agent', n); }
        function destroyAgent(n) { socket.emit('destroy-agent', n); }
        function disconnectAllAgents() { 
            socket.emit('stop-all-agents'); 
        }
        function confirmShutdown() {
            if (confirm('Are you sure you want to perform a full shutdown?\nThis will stop all agents and close the server.')) {
                socket.emit('shutdown');
            }
        }
        function sendMessage(n, m) {
            if (!m || !m.trim()) return;
            socket.emit('send-message', n, { from: 'ADMIN', message: m });
            const input = document.getElementById(`messageInput-${n}`);
            const btn = document.getElementById(`sendBtn-${n}`);
            if (input) input.value = '';
            if (btn) btn.disabled = true;
        }
        function onMsgInputChange(name) {
            const input = document.getElementById(`messageInput-${name}`);
            const btn = document.getElementById(`sendBtn-${name}`);
            if (btn && input) {
                btn.disabled = !(input.value && input.value.trim().length > 0);
            }
        }

        function toggleDetails(name) {
            const invSection = document.getElementById(`inventorySection-${name}`);
            if (!invSection) return;
            const visible = invSection.style.display !== 'none';
            const newVisible = !visible;
            invSection.style.display = newVisible ? '' : 'none';
            inventoryOpen[name] = newVisible;
        }
        window.toggleDetails = toggleDetails;
    </script>
</body>
</html>
